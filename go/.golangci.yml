version: "2"

linters:
  enable:
    - bidichk
    - cyclop
    - dupword
    - errorlint
    - exhaustive
    - gocognit
    - goconst
    - gocritic
    - godot
    - gosec
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilnil
    - nolintlint
    - prealloc
    - predeclared
    - unparam
    - usestdlibvars
    - whitespace

  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
    gosec:
      excludes:
        # The example logs the redacted proxy URL from its own environment.
        - G706

formatters:
  enable:
    - gofumpt
    - goimports
